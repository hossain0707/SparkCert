<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">SparkCert v0.2 development architecture</title><desc id="desc">Operator runs a local FastAPI service, UI and OpenSSH on their Windows, macOS or Linux device. Remote SSH provides read-only diagnostics from DGX Spark or another Linux host. AI evaluations contact a separately running OpenAI-compatible endpoint. Results persist locally in SQLite and are exported as PDF. No remote SparkCert agent is deployed by the MVP.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071624"/><stop offset="1" stop-color="#132c39"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#55dfc0"/></marker></defs>
<style>.d{stroke:#55dfc0;stroke-width:2;stroke-dasharray:8 8;fill:none;animation:move 7s linear infinite}@keyframes move{to{stroke-dashoffset:-112}}@media(prefers-reduced-motion:reduce){.d{animation:none}}</style>
<rect width="1200" height="630" rx="24" fill="url(#bg)"/><text x="48" y="64" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">SparkCert v0.2 architecture</text><text x="48" y="91" font-family="Arial,sans-serif" font-size="15" fill="#99b8c7">Implemented local-first control plane · v0.1.0 MVP · not an installed DGX Spark agent</text>
<rect x="40" y="117" width="717" height="432" rx="22" fill="#102333" stroke="#335a68"/><text x="65" y="151" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#cbf0ea">OPERATOR COMPUTER</text><text x="65" y="172" font-family="Arial,sans-serif" font-size="13" fill="#9eb9c7">Windows / macOS / Linux · 127.0.0.1 only</text>
<g font-family="Arial,sans-serif"><rect x="64" y="198" width="264" height="78" rx="13" fill="#172f40" stroke="#3a6272"/><rect x="65" y="199" width="5" height="76" rx="2" fill="#36cfa9"/><text x="81" y="229" font-size="17" font-weight="700" fill="#f0f8ff">Local app interface</text><text x="81" y="251" font-size="12" fill="#9dc0d0">Browser / optional pywebview</text><rect x="402" y="198" width="326" height="78" rx="13" fill="#172f40" stroke="#3a6272"/><rect x="403" y="199" width="5" height="76" rx="2" fill="#36cfa9"/><text x="419" y="229" font-size="17" font-weight="700" fill="#f0f8ff">FastAPI controller</text><text x="419" y="251" font-size="12" fill="#9dc0d0">Session token · loopback API</text><rect x="64" y="326" width="264" height="77" rx="13" fill="#172f40" stroke="#3a6272"/><rect x="65" y="327" width="5" height="75" rx="2" fill="#76aaf5"/><text x="81" y="357" font-size="17" font-weight="700" fill="#f0f8ff">System OpenSSH + tunnel manager</text><text x="81" y="379" font-size="12" fill="#9dc0d0">Verified known_hosts · aliases · agent</text><rect x="402" y="326" width="326" height="77" rx="13" fill="#172f40" stroke="#3a6272"/><rect x="403" y="327" width="5" height="75" rx="2" fill="#76aaf5"/><text x="419" y="357" font-size="17" font-weight="700" fill="#f0f8ff">Evaluation + latency measurements</text><text x="419" y="379" font-size="12" fill="#9dc0d0">Bounded requests to running model API</text><rect x="64" y="449" width="264" height="77" rx="13" fill="#172f40" stroke="#3a6272"/><rect x="65" y="450" width="5" height="75" rx="2" fill="#d4a4ff"/><text x="81" y="480" font-size="17" font-weight="700" fill="#f0f8ff">Evidence + retention</text><text x="81" y="502" font-size="12" fill="#9dc0d0">SQLite · result hash · audit / retention</text><rect x="402" y="449" width="326" height="77" rx="13" fill="#172f40" stroke="#3a6272"/><rect x="403" y="450" width="5" height="75" rx="2" fill="#d4a4ff"/><text x="419" y="480" font-size="17" font-weight="700" fill="#f0f8ff">PDF report generator</text><text x="419" y="502" font-size="12" fill="#9dc0d0">Traceable check results · timestamps</text></g>
