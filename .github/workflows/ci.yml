name: SparkCert - Tests, Desktop Packages and Preview Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q sparkcert
      - run: node --check web/app.js
      - run: python -m compileall -q scripts

  security:
    name: Dependency audit and SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pip-audit cyclonedx-bom
      - run: python -m pip_audit
      - run: cyclonedx-py environment -o sbom.json --output-format JSON
      - uses: actions/upload-artifact@v4
        with:
          name: SparkCert-SBOM
          path: sbom.json
          retention-days: 30

  package:
    name: Packaging (${{ matrix.id }})
    needs: [test, security]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64, os: windows-2022, platform: windows }
          - { id: macos-intel, os: macos-15-intel, platform: macos }
          - { id: macos-arm64, os: macos-15, platform: macos }
          - { id: linux-x64, os: ubuntu-24.04, platform: linux }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux GTK/WebKit GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 xvfb
      - name: Install desktop build toolchain
        run: python -m pip install -e '.[desktop]' pillow
      - name: Generate platform icons
        run: python scripts/generate_icons.py
      - name: Build self-contained desktop application
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name SparkCert \
            --icon "assets/sparkcert-icon.${{ matrix.platform == 'windows' && 'ico' || matrix.platform == 'macos' && 'icns' || 'png' }}" \
            --add-data 'web:web' \
            --collect-all uvicorn \
            --collect-all webview \
            --hidden-import sparkcert.app \
            desktop_launcher.py
      - name: Windows packaged import and asset test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\SparkCert\SparkCert.exe").Path
          $report = Join-Path (Get-Location) "dist\package-check.json"
          # Windows GUI executables may return immediately when launched with &.
          # Wait for the packaged binary and read its structured self-check report.
          $proc = Start-Process -FilePath $exe -ArgumentList @('--package-self-check', $report) -Wait -PassThru
          if (-not (Test-Path $report)) { throw "Packaged binary did not create its self-check report" }
          $test = Get-Content $report -Raw | ConvertFrom-Json
          if ($proc.ExitCode -ne 0 -or -not $test.ok) {
            Write-Host ($test | ConvertTo-Json -Depth 4)
            throw "Packaged import test failed with exit code $($proc.ExitCode)"
          }
      - name: macOS/Linux packaged import and asset test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == 'macOS' ]]; then
            ./dist/SparkCert.app/Contents/MacOS/SparkCert --package-self-check "${{ github.workspace }}/dist/package-check.json"
          else
            ./dist/SparkCert/SparkCert --package-self-check "${{ github.workspace }}/dist/package-check.json"
          fi
          python -c 'import json; assert json.load(open("dist/package-check.json"))["ok"]'
      - name: Build Windows portable ZIP and per-user EXE installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Compress-Archive -Path dist/SparkCert -DestinationPath dist/release/SparkCert-Portable-Windows-x64.zip -CompressionLevel Optimal
          choco install innosetup --yes --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\SparkCert.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup packaging failed' }
      - name: Create macOS Applications-ready unsigned DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/release dist/dmg-stage
          cp -R dist/SparkCert.app dist/dmg-stage/
          ln -s /Applications dist/dmg-stage/Applications
          if [[ "${{ matrix.id }}" == 'macos-arm64' ]]; then label=Apple-Silicon; else label=Intel; fi
          hdiutil create -volname 'SparkCert Preview' -srcfolder dist/dmg-stage -ov -format UDZO "dist/release/SparkCert-macOS-${label}.dmg"
      - name: Build Ubuntu DEB and portable Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package_linux.sh
      - name: Upload packaged downloads
        uses: actions/upload-artifact@v4
        with:
          name: SparkCert-distribution-${{ matrix.id }}
          path: dist/release/*
          retention-days: 30
          if-no-files-found: error
      - name: Upload package import check
        uses: actions/upload-artifact@v4
        with:
          name: SparkCert-package-check-${{ matrix.id }}
          path: dist/package-check.json
          retention-days: 30

  preview-release:
    name: Publish unsigned preview downloads
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, security, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SparkCert-distribution-*
          path: release-assets
          merge-multiple: true
      - name: Verify all OS downloads are present and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for f in \
            SparkCert-Setup-Windows-x64.exe \
            SparkCert-Portable-Windows-x64.zip \
            SparkCert-macOS-Apple-Silicon.dmg \
            SparkCert-macOS-Intel.dmg \
            SparkCert-Linux-Ubuntu-x64.deb \
            SparkCert-Portable-Linux-x64.tar.gz; do
              test -s "$f" || { echo "Missing release package: $f"; exit 1; }
          done
          sha256sum SparkCert-* > SHA256SUMS.txt
          ls -lah
      - name: Create versioned development preview release (never marked stable)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.2.1-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SparkCert v0.2.1 · Unsigned Developer Preview #${GITHUB_RUN_NUMBER}" \
            --notes-file docs/PREVIEW_RELEASE_NOTES.md
