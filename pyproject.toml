[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkcert"
version = "0.1.0"
description = "Local-first AI deployment readiness workbench for DGX Spark and SSH-managed Linux systems"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pydantic>=2,<3",
  "httpx>=0.27,<1",
  "reportlab>=4,<5",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
desktop = ["pywebview>=5,<7", "pyinstaller>=6,<8"]

[project.scripts]
sparkcert = "sparkcert.__main__:main"

[tool.setuptools.packages.find]
include = ["sparkcert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
