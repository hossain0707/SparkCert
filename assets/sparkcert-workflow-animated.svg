<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">Animated SparkCert workflow illustration</title><desc id="desc">An illustrative four-stage product tour: connect by SSH, inspect host, evaluate model, and export report. Does not show live test results.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#162b3d"/></linearGradient><linearGradient id="active" x2="1"><stop stop-color="#32dab1"/><stop offset="1" stop-color="#6d9ded"/></linearGradient></defs>
<style>
.scene{opacity:0;animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}.s0{animation-name:p0}.s1{animation-name:p1}.s2{animation-name:p2}.s3{animation-name:p3}
@keyframes p0{0%,20%{opacity:1}24%,100%{opacity:0}}@keyframes p1{0%,23%{opacity:0}27%,45%{opacity:1}49%,100%{opacity:0}}@keyframes p2{0%,48%{opacity:0}52%,70%{opacity:1}74%,100%{opacity:0}}@keyframes p3{0%,73%{opacity:0}77%,96%{opacity:1}100%{opacity:0}}
.pulse{animation:pop 2.8s ease-in-out infinite}@keyframes pop{0%,100%{opacity:.48}50%{opacity:1}}.dash{stroke-dasharray:9 9;animation:travel 4s linear infinite}@keyframes travel{to{stroke-dashoffset:-72}}
@media (prefers-reduced-motion: reduce){.scene{animation:none;opacity:0}.s0{opacity:1}.pulse,.dash{animation:none}}
</style><rect width="1200" height="530" rx="22" fill="url(#b)"/><rect x="18" y="18" width="1164" height="494" rx="19" stroke="#385669" fill="none"/>
